# TLA+ モデルの検査(issue #19)。formal/ かファームのパッチが変わったときに回す。
name: formal

on:
  push:
    branches: [main]
    paths:
      - "formal/**"
      - "firmware/muse-stackchan.patch"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "formal/**"
      - "firmware/muse-stackchan.patch"
      - ".github/workflows/formal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: formal/.tools
          key: tla2tools-${{ hashFiles('formal/check.sh') }}
      - name: TLC
        run: ./formal/check.sh
